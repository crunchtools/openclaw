name: Container
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions: {}
jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.51.0
    permissions:
      contents: read
      issues: write
      pull-requests: read
    with:
      image: quay.io/crunchtools/openclaw
      # The gateway must come up and report healthy (the Containerfile
      # HEALTHCHECK, `openclaw health`) with the minimal config in
      # tests/image/home mounted where production mounts ~/.openclaw. An
      # overlay mount (:O) keeps the checkout untouched while the gateway writes.
      boot: healthcheck
      boot-run-args: -v ./tests/image/home:/app/.openclaw:O
      boot-timeout: 180
      # RT #1534 build patch: the OpenRouter image provider must honor
      # request.allowPrivateNetwork and stay blocked without it.
      contract-test: |
        podman run --rm --network none --entrypoint node \
          -v "$PWD/scripts:/t:ro,Z" "$IMAGE" /t/test-openrouter-private-network.mjs
      # Hosts refuse an unsigned quay.io/crunchtools image
      # (crunchtools/rhel10-bootc-server#47). Promote signs the gated digest
      # before any tag moves, with the key from this repo's cosign-signing
      # environment (default branch and v* only); without it promote refuses.
      sign: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
