name: Build and Push OpenClaw

# Constitution Section III: dual-push to Quay and GHCR as two separate jobs,
# gha layer caching on both, Trivy on the built image. RT #1480.
#
# The build moved off redhat-actions/buildah-build to docker/build-push-action
# because buildah has no equivalent of cache-from/cache-to type=gha.
#
# Deviation worth knowing about: Section III describes the Trivy step as
# continue-on-error. This repo has always run it blocking (exit-code 1), and
# that is left alone -- turning a security gate advisory is not a side effect
# a CI cleanup should have.

on:
  push:
    branches: [main]
    paths:
      - 'Containerfile'
      - 'config/**'
      - '.github/workflows/build.yml'
  workflow_call:
  workflow_dispatch:

env:
  QUAY_IMAGE: quay.io/crunchtools/openclaw
  GHCR_IMAGE: ghcr.io/crunchtools/openclaw

jobs:
  build-and-push-quay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha_short: ${{ steps.version.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version tag
        id: version
        run: |
          TAG=$(git describe --tags --always 2>/dev/null || echo "v1.0.0")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # load: true puts the image in the local daemon so Trivy can scan it
      # before anything is published. This replaces the podman save to a tarball.
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          load: true
          tags: openclaw:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: openclaw:scan
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Log in to Quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # Cache hit, not a rebuild -- this is what cache-to: mode=max above buys.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.QUAY_IMAGE }}:latest
            ${{ env.QUAY_IMAGE }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=OpenClaw game server
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-ghcr:
    runs-on: ubuntu-latest
    needs: build-and-push-quay
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ needs.build-and-push-quay.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=OpenClaw game server
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
